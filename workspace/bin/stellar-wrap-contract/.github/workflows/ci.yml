name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
    - name: Install cargo-audit
      uses: taiki-e/install-action@3e95b5d2ea53a19022dddec602c648200467d281 # cargo-audit
    - name: Run cargo audit
      run: cargo audit

  docker:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      with:
        targets: wasm32-unknown-unknown

    - name: Build via Makefile docker-build
      run: docker build -t stellar-wrap-contract .

    - name: Verify WASM artifact in Docker image
      run: |
        docker run --rm stellar-wrap-contract test -s /contract/target/wasm32-unknown-unknown/release/stellar_wrap_contract.wasm

  test:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-D warnings"
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      with:
        targets: wasm32-unknown-unknown
    - name: Check format
      run: cargo fmt --check
    - name: Run clippy
      run: cargo clippy --all-targets -- -D warnings
    - name: Check doc compilation
      run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps
    - name: Run tests
      run: cargo test
    - name: Track WASM size budget
      run: ./scripts/check_wasm_size.sh
    - name: Check README documents all entrypoints
      run: python3 scripts/check_readme_entrypoints.py
    - name: Clean test snapshots
      run: rm -rf test_snapshots/

  coverage:
    runs-on: ubuntu-latest
    # RUSTFLAGS is intentionally NOT set here.
    # The test job sets "-D warnings" job-wide; tarpaulin instruments code
    # under its own cargo invocation and may emit warnings from proc-macros
    # or generated code that would otherwise fail CI.  Keeping this job free
    # of -D warnings isolates any tarpaulin-side noise from the test/lint gate.
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Install Rust (native only — no wasm32 target needed for tarpaulin)
      uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

    - name: Cache cargo registry
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ~/.cargo/bin
        key: ${{ runner.os }}-cargo-tarpaulin-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-tarpaulin-

    - name: Install cargo-tarpaulin
      # Only install if not already cached.  --locked ensures the exact
      # version published in Cargo.lock (or the tarpaulin registry entry) is
      # used, giving reproducible installs across runs.
      run: |
        if ! command -v cargo-tarpaulin &>/dev/null; then
          cargo install cargo-tarpaulin --locked
        fi

    - name: Run coverage
      # tarpaulin.toml configures: --lib, Html+Xml output, coverage/ dir,
      # fail-under=90, and file exclusions.  Passing --config makes the
      # location explicit so this job is not sensitive to working-directory.
      run: cargo tarpaulin --config tarpaulin.toml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
      with:
        files: coverage/cobertura.xml
        fail_ci_if_error: false   # don't block CI on codecov outages
        token: ${{ secrets.CODECOV_TOKEN }}

    - name: Upload HTML coverage report as artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: coverage-report
        path: coverage/tarpaulin-report.html
        retention-days: 30
