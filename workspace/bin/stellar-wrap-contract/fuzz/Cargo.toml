[package]
name = "stellar_wrap_contract-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
soroban-sdk = { version = "=21.7.1", features = ["testutils"] }
ed25519-dalek = { version = "=2.1.1", features = ["rand_core"] }

[dependencies.stellar_wrap_contract]
path = ".."
features = ["testutils"]

[[bin]]
name = "fuzz_mint_wrap"
path = "fuzz_targets/fuzz_mint_wrap.rs"
test = false
doc = false
bench = false
