[package]
name = "stellar_wrap_contract"
version = "0.1.0"
edition = "2021"
resolver = "2"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[features]
# Enables SorobanArbitrary / testutils codegen required by cargo-fuzz targets.
testutils = ["soroban-sdk/testutils"]

[dependencies]
soroban-sdk = "=27.0.3"
# ed25519-dalek is a direct dependency (not just dev) to force Cargo version
# unification across the dependency tree. soroban-env-host transitively depends
# on ed25519-dalek and would otherwise resolve to an incompatible v3.0.
# Cargo.lock is committed to ensure reproducible builds; keep this pin synced
# whenever the lockfile is regenerated.
ed25519-dalek = { version = "=3.0.0", features = ["rand_core"] }

[dev-dependencies]
# Main Soroban SDK with test utilities (required for Address::generate, mock_auths, etc.)
soroban-sdk = { version = "=27.0.3", features = ["testutils"] }

# Property-based testing
proptest = { version = "1", default-features = false, features = ["alloc"] }

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
codegen-units = 1
