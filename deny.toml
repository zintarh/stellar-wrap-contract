# License, duplicate-crate, and advisory policy for the wrap contract.
# CI runs `cargo deny check`. Allowed exceptions are listed below with the
# reason each one cannot be removed while depending on Soroban 27.

[graph]
targets = [
    "wasm32-unknown-unknown",
    "x86_64-unknown-linux-gnu",
]
all-features = false
no-default-features = false

[advisories]
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste 1.0.15 is unmaintained and is only a compile-time dependency of ark-ff and wasmi_core through soroban-env-host 27.0.1. It is not linked into the wasm contract, and the advisory has no fixed release." },
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8
exceptions = []

# The contract crate itself is unpublished (publish = false in Cargo.toml)
# and has no SPDX license. Third-party crates are still checked.
[licenses.private]
ignore = true

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
# Exact versions skipped during duplicate detection. Each entry is a second
# copy forced by an incompatible major inside the Soroban 27 graph.
# Versions are listed individually so a shared crate (for example syn) is
# still checked when only one of its copies sits under an excepted crate.
skip = [
    # Guest pin of ed25519-dalek 3.0.0. soroban-sdk 27.0.3 and soroban-env-host
    # 27.0.1 still require 2.1.1, and the majors are incompatible. The crates
    # below exist only on the 3.0.0 side of that split.
    { crate = "ed25519-dalek@3.0.0", reason = "Direct pin in Cargo.toml so guest verification uses 3.0.0. soroban-sdk 27.0.3 and soroban-env-host 27.0.1 still require 2.1.1, and the majors are incompatible." },
    { crate = "block-buffer@0.12.1", reason = "Only required by digest 0.11, which is only required by the ed25519-dalek 3.0.0 pin." },
    { crate = "cpufeatures@0.3.0", reason = "Only required by curve25519-dalek 5 and sha2 0.11, which are only required by the ed25519-dalek 3.0.0 pin." },
    { crate = "crypto-common@0.2.2", reason = "Only required by digest 0.11, which is only required by the ed25519-dalek 3.0.0 pin." },
    { crate = "curve25519-dalek@5.0.0", reason = "Only required by the ed25519-dalek 3.0.0 pin. soroban-env-host uses curve25519-dalek 4." },
    { crate = "digest@0.11.3", reason = "Only required by curve25519-dalek 5 and sha2 0.11 on the ed25519-dalek 3.0.0 pin. The Soroban 27 host stack uses digest 0.10." },
    { crate = "ed25519@3.0.0", reason = "Only required by the ed25519-dalek 3.0.0 pin. ed25519-dalek 2.1.1 uses ed25519 2." },
    { crate = "rand_core@0.10.1", reason = "Only required by the ed25519-dalek 3.0.0 pin. The Soroban 27 host stack uses rand_core 0.6." },
    { crate = "sha2@0.11.0", reason = "Only required by the ed25519-dalek 3.0.0 pin. The Soroban 27 host stack uses sha2 0.10." },
    { crate = "signature@3.0.0", reason = "Only required by the ed25519-dalek 3.0.0 pin. The Soroban 27 host stack uses signature 2." },
    # Proc-macro majors that Soroban 27 does not align.
    { crate = "darling@0.23.0", reason = "Proc-macro only. serde_with 3.21 (stellar-xdr and soroban-ledger-snapshot) uses darling 0.23; soroban-sdk-macros 27 uses darling 0.20." },
    { crate = "darling_core@0.23.0", reason = "Proc-macro only. Follows darling 0.23 from serde_with_macros; soroban-sdk-macros 27 uses darling_core 0.20." },
    { crate = "darling_macro@0.23.0", reason = "Proc-macro only. Follows darling 0.23 from serde_with_macros; soroban-sdk-macros 27 uses darling_macro 0.20." },
    { crate = "syn@3.0.3", reason = "Proc-macro only. serde_derive 1.0.229 and enum-ordinalize-derive (arkworks via soroban-env-host) require syn 3; the rest of the Soroban 27 macro stack uses syn 2." },
    # Other Soroban 27 splits that are not semver-compatible.
    { crate = "crate-git-revision@0.0.9", reason = "Build-script only. soroban-sdk 27.0.3 uses 0.0.9; soroban-env-common, stellar-strkey, and stellar-xdr use 0.0.6." },
    { crate = "hashbrown@0.17.1", reason = "wasmparser 0.116 (soroban-env-common) uses indexmap 2 / hashbrown 0.17; arkworks inside soroban-env-host uses hashbrown 0.15." },
    { crate = "stellar-strkey@0.0.16", reason = "soroban-sdk 27.0.3 depends on 0.0.16; soroban-env-host and stellar-xdr 27 depend on 0.0.13." },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
