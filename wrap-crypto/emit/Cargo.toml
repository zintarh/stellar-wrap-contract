[package]
name = "wrap-crypto-emit"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "emit-vectors"
path = "src/main.rs"

[dependencies]
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["rand_core"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
soroban-sdk = { version = "=27.0.3", features = ["testutils"] }
