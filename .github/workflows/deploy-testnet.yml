name: Deploy Testnet

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      contract_id:
        description: Existing contract ID to upgrade. Leave empty to deploy a new contract.
        required: false
        type: string
      admin_address:
        description: Final admin address. The deployer transfers authority to this address after initialization.
        required: false
        type: string
      admin_pubkey:
        description: Ed25519 public key used to verify wrap signatures. Defaults to STELLAR_ADMIN_PUBKEY secret.
        required: false
        type: string
      initialize:
        description: Initialize newly deployed contracts.
        required: false
        default: true
        type: boolean

jobs:
  deploy-testnet:
    runs-on: ubuntu-latest
    env:
      STELLAR_NETWORK: testnet
      WASM_PATH: target/wasm32-unknown-unknown/release/stellar_wrap_contract.wasm
      INPUT_CONTRACT_ID: ${{ github.event.inputs.contract_id || secrets.STELLAR_TESTNET_CONTRACT_ID }}
      INPUT_ADMIN_ADDRESS: ${{ github.event.inputs.admin_address || secrets.STELLAR_TESTNET_ADMIN_ADDRESS }}
      INPUT_ADMIN_PUBKEY: ${{ github.event.inputs.admin_pubkey || secrets.STELLAR_ADMIN_PUBKEY }}
      INPUT_INITIALIZE: ${{ github.event.inputs.initialize == 'false' && 'false' || 'true' }}
      STELLAR_ADMIN_IDENTITY: ${{ secrets.STELLAR_TESTNET_ADMIN_SECRET != '' && 'admin' || 'deployer' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Stellar CLI
        run: cargo install stellar-cli --locked

      - name: Configure deployer
        env:
          STELLAR_DEPLOYER_SECRET: ${{ secrets.STELLAR_DEPLOYER_SECRET }}
          STELLAR_ADMIN_SECRET: ${{ secrets.STELLAR_TESTNET_ADMIN_SECRET }}
        run: |
          if [ -z "$STELLAR_DEPLOYER_SECRET" ]; then
            echo "STELLAR_DEPLOYER_SECRET is required" >&2
            exit 1
          fi
          stellar keys add deployer --secret-key "$STELLAR_DEPLOYER_SECRET"
          if [ -n "$STELLAR_ADMIN_SECRET" ]; then
            stellar keys add admin --secret-key "$STELLAR_ADMIN_SECRET"
          fi
          stellar network use "$STELLAR_NETWORK"

      - name: Install deployment dependencies
        run: npm ci --prefix scripts

      - name: Build and deploy
        id: deploy
        env:
          STELLAR_DEPLOYER_IDENTITY: deployer
        run: make deploy-testnet

      - name: Upload deployment manifest for pipeline
        uses: actions/upload-artifact@v4
        with:
          name: stellar-testnet-deployment-manifest
          path: deployments/manifest.json

      - name: Deployment summary
        run: |
          {
            echo "## Stellar testnet deployment"
            echo ""
            echo "- Action: ${{ steps.deploy.outputs.action }}"
            echo "- Contract ID: \`${{ steps.deploy.outputs.contract_id }}\`"
            echo "- Admin: \`${{ steps.deploy.outputs.admin }}\`"
            echo "- Manifest: \`deployments/manifest.json\`"
          } >> "$GITHUB_STEP_SUMMARY"
