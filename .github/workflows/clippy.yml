name: Cargo Clippy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  clippy:
    name: Cargo Test and Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Run Rust test suite
        run: cargo test --all-features
      - name: Run cargo clippy
        run: cargo clippy --workspace --all-targets --all-features --no-deps
        env:
          RUSTFLAGS: "-C overflow-checks=yes"
