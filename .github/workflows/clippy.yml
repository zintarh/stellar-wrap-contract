name: Cargo Clippy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  clippy:
    name: Cargo Clippy Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - name: Run cargo clippy
        run: cargo clippy --workspace --all-targets --all-features --no-deps
        env:
          RUSTFLAGS: "-C overflow-checks=yes"
