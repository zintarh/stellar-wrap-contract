name: Cargo Clippy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  clippy:
    name: Cargo Test and Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: clippy
      - name: Run Rust test suite
        run: cargo test --all-features
      - name: Run cargo clippy
        run: cargo clippy --workspace --all-targets --all-features --no-deps
        env:
          RUSTFLAGS: "-C overflow-checks=yes"
