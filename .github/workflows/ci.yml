name: CI
on: [push, pull_request]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Install cargo-audit
      uses: taiki-e/install-action@cargo-audit
    - name: Run cargo audit
      run: cargo audit

  test:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-D warnings"
    steps:
    - uses: actions/checkout@v5
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown
        components: clippy, rustfmt
    - name: Check format
      run: cargo fmt --all -- --check
    - name: Run clippy
      run: cargo clippy --all-targets
    - name: Check doc compilation
      run: RUSTDOCFFLAGS="-D warnings" cargo doc --no-deps
    - name: Run tests
      run: cargo test
    - name: Track WASM size budget
      run: ./scripts/check_wasm_size.sh
    - name: Check README documents all entrypoints
      run: python3 scripts/check_readme_entrypoints.py
    - name: Clean test snapshots
      run: rm -rf test_snapshots/

  coverage:
    runs-on: ubuntu-latest
    # RUSTFLAGS is intentionally NOT set here.
    # The test job sets "-D warnings" job-wide; tarpaulin instruments code
    # under its own cargo invocation and may emit warnings from proc-macros
    # or generated code that would otherwise fail CI.  Keeping this job free
    # of -D warnings isolates any tarpaulin-side noise from the test/lint gate.
    steps:
    - uses: actions/checkout@v5

    - name: Install Rust (native only — no wasm32 target needed for tarpaulin)
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo registry
      uses: actions/cache@v5
      with:
        path:
          |
          ~/.cargo/registry
          ~/.cargo/git
          ~/.cargo/bin
        key: $currency, cargo-tarpaulin, and hashFiles of Cargo.lock
        restore-keys:
          runner.os-cargo-tarpaulin-
    - name: Install cargo-tarpaulin
      run: |
        if ! command -v cargo-tarpaulin >/dev/null; then
          cargo install cargo-tarpaulin --locked
        fi
    - name: Run coverage
      run: cargo tarpaulin --config tarpaulin.toml
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: coverage/cobertura.xml
        fail_ci_if_error: false
        token: $ secrets.CODECOV_TOKEN $
    - name: Upload HTML coverage report as artifact
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage/tarpaulin-report.html
        retention-days: 30
