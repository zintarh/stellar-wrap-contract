name: CI

on: [push, pull_request]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Install cargo-audit
      uses: taiki-e/install-action@cargo-audit
    - name: Run cargo audit
      run: cargo audit

  test:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-D warnings -C overflow-checks=on"
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown
    - name: Check format
      run: cargo fmt --check
    - name: Run clippy
      run: cargo clippy --all-targets -- -D warnings
    - name: Check doc compilation
      run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps
    - name: Run tests
      run: cargo test
    - name: Track WASM size budget
      run: ./scripts/check_wasm_size.sh
    - name: Check README documents all entrypoints
      run: python3 scripts/check_readme_entrypoints.py
    - name: Clean test snapshots
      run: rm -rf test_snapshots/

  coverage:
    runs-on: ubuntu-latest
    # RUSTFLAGS intentionally avoids -D warnings but enables overflow-checks.
    # The test job sets "-D warnings" job-wide; tarpaulin instruments code
    # under its own cargo invocation and may emit warnings from proc-macros
    # or generated code that would otherwise fail CI.  Keeping this job free
    # of -D warnings isolates any tarpaulin-side noise from the test/lint gate.
    env:
      RUSTFLAGS: "-C overflow-checks=on"
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Install cargo-tarpaulin
      uses: actions/cache@v4
      with:
        path:
          |
            ~/cargo/registry
            ~/cargo/git
            ~/cargo/bin
        key: $``{ runner.os }}-cargo-tarpaulin-$``{ hashFiles('**/Cargo.lock') }}
        restore-keys:
          |
            $``{ runner.os }}-cargo-tarpaulin-
    - name: Run coverage
      run: cargo tarpaulin --config tarpaulin.toml
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: coverage/cobertura.xml
        fail_ci_if_error: false
        token: $``{ secrets.CODECOV_TOKEN }}
    - name: Upload HTML coverage report as artifact
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage/tarpaulin-report.html
        retention-days: 30
