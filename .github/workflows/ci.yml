name: Frontend

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/ci.yml'
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/ci.yml'

jobs:
  frontend:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test --if-present

      - name: Start preview server
        run: |
          ./node_modules/.bin/vite preview --host 127.0.0.1 --port 3000 > /tmp/vite-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/vite-preview.log
          exit 1

      - name: Accessibility check
        run: npx --yes @axe-core/cli http://127.0.0.1:3000 --exit

  resource-budget:
    name: Resource Budget
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-budget-${{ hashFiles('**/Cargo.lock') }}

      - name: Measure resource budgets
        run: |
          cargo test --test resource_budget -- --nocapture 2>&1 | tee /tmp/resource-budget.log

      - name: Enforce resource budget
        run: |
          cargo run --quiet --bin resource_budget_check -- \
            --baseline resource-budget.json \
            --measurements /tmp/resource-budget.log \
            --threshold 0.10 \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload budget log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resource-budget-log
          path: /tmp/resource-budget.log
