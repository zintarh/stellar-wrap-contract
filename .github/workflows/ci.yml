name: CI

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'src/**'
      - 'contracts/**'
      - 'spec/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/ci.yml'
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'src/**'
      - 'contracts/**'
      - 'spec/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/ci.yml'

jobs:
  contract-spec:
    name: Contract Spec Snapshot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Stellar CLI
        run: cargo install stellar-cli --locked

      - name: Build WASM (release)
        run: cargo build --release --target wasm32-unknown-unknown

      - name: Inspect contract spec
        run: |
          set -euo pipefail
          stellar contract inspect \
            --wasm target/wasm32-unknown-unknown/release/stellar_wrap_contract.wasm \
            --output json > /tmp/registry.json

      - name: Fail on unreviewed spec drift
        run: |
          set -euo pipefail
          if ! diff -u spec/registry.json /tmp/registry.json; then
            echo "::error::Contract spec differs from spec/registry.json. Review the ABI change, then run 'make spec-snapshot' and commit the updated snapshot."
            exit 1
          fi

  frontend:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test --if-present

      - name: Start preview server
        run: |
          ./node_modules/.bin/vite preview --host 127.0.0.1 --port 3000 > /tmp/vite-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/vite-preview.log
          exit 1

      - name: Accessibility check
        run: npx --yes @axe-core/cli http://127.0.0.1:3000 --exit
