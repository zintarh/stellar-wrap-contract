name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown
    - name: Check format
      run: cargo fmt --check
    - name: Run clippy
      run: cargo clippy -- -D warnings
    - name: Run tests
      run: cargo test
    - name: Build WASM
      run: cargo build --release --target wasm32-unknown-unknown
    - name: Check WASM binary size
      run: |
        WASM=target/wasm32-unknown-unknown/release/stellar_wrap_contract.wasm
        SIZE=$(wc -c < "$WASM")
        echo "WASM binary size: $SIZE bytes ($(( SIZE / 1024 )) KB)"
        MAX_SIZE=65536  # 64 KB threshold
        if [ "$SIZE" -gt "$MAX_SIZE" ]; then
          echo "ERROR: WASM binary ($SIZE bytes) exceeds the 64 KB recommended threshold ($MAX_SIZE bytes)."
          echo "Consider running wasm-opt -Oz or auditing new dependencies for bloat."
          exit 1
        fi
        echo "OK: WASM size is within the 64 KB threshold."