name: Pipeline

on:
  pull_request:
    paths:
      - 'pipeline/**'
      - '.github/workflows/pipeline.yml'
  push:
    branches:
      - main
    paths:
      - 'pipeline/**'
      - '.github/workflows/pipeline.yml'

jobs:
  pipeline:
    name: Typecheck, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: indexer
          POSTGRES_PASSWORD: indexer
          POSTGRES_DB: indexer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://indexer:indexer@localhost:5432/indexer_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: pipeline/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test -- --coverage

      - name: Build
        run: npm run build

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: pipeline/coverage/lcov.info
          flags: pipeline
          fail_ci_if_error: false
