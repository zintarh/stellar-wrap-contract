name: Docs Links

on:
  pull_request:
    paths:
      - '**/*.md'
      - '.lychee.toml'
      - '.github/workflows/docs-links.yml'
  push:
    branches:
      - main
    paths:
      - '**/*.md'
      - '.lychee.toml'
      - '.github/workflows/docs-links.yml'

permissions:
  contents: read

jobs:
  link-check:
    name: Check Markdown Links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check links in Markdown files
        uses: lycheeverse/lychee-action@v2
        with:
          # Offline mode verifies local and relative links without any network
          # requests, so a broken relative link (a moved file, a renamed test
          # module, a stale heading) fails the job deterministically.
          args: --offline --config .lychee.toml --no-progress --include-fragments './**/*.md'
          fail: true
