name: Mutation Testing

on:
  pull_request:
    paths:
      - 'src/**/*.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.mutants.toml'
      - '.cargo/mutants.toml'
      - '.github/workflows/mutation.yml'
      - 'scripts/check_mutation_scores.py'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  mutants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants

      - name: Run mutation tests
        id: mutants
        continue-on-error: true
        run: |
          set -o pipefail
          cargo mutants --in-place 2>&1 | tee mutation-report.txt

      - name: Gate per-module scores and summarize missed mutants
        if: always()
        run: python3 scripts/check_mutation_scores.py

      - name: Upload mutation report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: |
            mutation-report.txt
            mutants.out/
