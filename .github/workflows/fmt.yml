name: Cargo Fmt
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
env:
  RUSTFLAGS: "-C overflow-checks=on"
jobs:
  fmt:
    name: Cargo Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Run cargo fmt check
        run: cargo fmt --all -- --check
