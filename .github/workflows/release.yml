name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # Cache the Cargo registry and build artefacts (#307).
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-preflight

      - name: Verify version consistency
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "Tag version: $VERSION"

          CARGO_VERSION=$(cargo metadata --no-deps --format-version=1 \
            | jq -r '.packages[] | select(.name == "stellar_wrap_contract") | .version')
          echo "Cargo.toml version: ${CARGO_VERSION:-<none>}"

          CHANGELOG_VERSION=$(sed -nE 's/^## ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CHANGELOG.md | head -n1)
          echo "CHANGELOG.md version: ${CHANGELOG_VERSION:-<none>}"

          if [ -z "${CARGO_VERSION:-}" ] || [ "$VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Release tag ($TAG) does not match Cargo.toml package version (${CARGO_VERSION:-<none>})"
            exit 1
          fi

          if [ -z "${CHANGELOG_VERSION:-}" ] || [ "$VERSION" != "$CHANGELOG_VERSION" ]; then
            echo "::error::Release tag ($TAG) does not match CHANGELOG.md's latest release heading (${CHANGELOG_VERSION:-<none>})"
            exit 1
          fi

          echo "Tag, Cargo.toml, and CHANGELOG.md agree: $VERSION"

      - name: Run test suite
        run: cargo test --all-features

  security-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    outputs:
      blocking: ${{ steps.check.outputs.blocking }}
    steps:
      - name: Check for open security-labelled issues
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          COUNT=$(gh issue list \
            --repo "${{ github.repository }}" \
            --label security \
            --state open \
            --limit 100 \
            --json number \
            --jq 'length')
          echo "Open security-labelled issues: $COUNT"
          if [ "$COUNT" -gt 0 ]; then
            echo "blocking=true" >> "$GITHUB_OUTPUT"
            echo "::error::Release blocked: $COUNT open security-labelled issue(s). See SECURITY_AUDIT_CHECKLIST.md blocking findings."
            gh issue list \
              --repo "${{ github.repository }}" \
              --label security \
              --state open \
              --limit 100 \
              --json number,title \
              --jq '.[] | "#\(.number) \(.title)"'
          else
            echo "blocking=false" >> "$GITHUB_OUTPUT"
          fi

  build-a:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build WASM (release)
        run: |
          docker build -t stellar-wrap-build .
          docker run --rm -v "$PWD/out:/out" stellar-wrap-build

      - name: Compute SHA256
        id: sha256
        run: |
          WASM_FILE="out/stellar_wrap_contract.wasm"
          SHA=$(sha256sum "$WASM_FILE" | awk '{print $1}')
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"

      - name: Upload WASM
        uses: actions/upload-artifact@v4
        with:
          name: wasm-a
          path: out/stellar_wrap_contract.wasm

    outputs:
      sha256: ${{ steps.sha256.outputs.sha256 }}

  build-b:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build WASM (release)
        run: |
          docker build -t stellar-wrap-build .
          docker run --rm -v "$PWD/out:/out" stellar-wrap-build

      - name: Compute SHA256
        id: sha256
        run: |
          WASM_FILE="out/stellar_wrap_contract.wasm"
          SHA=$(sha256sum "$WASM_FILE" | awk '{print $1}')
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"

      - name: Upload WASM
        uses: actions/upload-artifact@v4
        with:
          name: wasm-b
          path: out/stellar_wrap_contract.wasm

    outputs:
      sha256: ${{ steps.sha256.outputs.sha256 }}

  verify-reproducible:
    needs: [build-a, build-b]
    runs-on: ubuntu-latest
    steps:
      - name: Compare independent build hashes
        run: |
          echo "build-a: ${{ needs.build-a.outputs.sha256 }}"
          echo "build-b: ${{ needs.build-b.outputs.sha256 }}"
          if [ "${{ needs.build-a.outputs.sha256 }}" != "${{ needs.build-b.outputs.sha256 }}" ]; then
            echo "::error::Builds are not reproducible: hashes differ"
            exit 1
          fi
          echo "Builds are reproducible: hashes match"

  release:
    needs: [security-gate, verify-reproducible]
    if: needs.security-gate.outputs.blocking == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download verified WASM
        uses: actions/download-artifact@v4
        with:
          name: wasm-a
          path: out

      - name: Compute SHA256
        id: sha256
        run: |
          WASM_FILE="out/stellar_wrap_contract.wasm"
          SHA=$(sha256sum "$WASM_FILE" | awk '{print $1}')
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "$SHA  stellar_wrap_contract.wasm" > out/stellar_wrap_contract.wasm.sha256

      - name: "Reminder: update CHANGELOG before tagging"
        run: 'echo "Reminder: update CHANGELOG.md with this version details before tagging."'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/stellar_wrap_contract.wasm
            out/stellar_wrap_contract.wasm.sha256
          body: |
            ## Release ${{ github.ref_name }}

            **WASM SHA256:** `${{ steps.sha256.outputs.sha256 }}`
